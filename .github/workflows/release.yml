name: Release Meta Code

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      METACODE_PACKAGE_ROOT: ${{ github.workspace }}\release-artifacts
      METACODE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $packageVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run test:ci

      - name: Build desktop packages
        run: npm run desktop:package

      - name: Prepare release metadata
        shell: pwsh
        env:
          METACODE_MANIFEST_SIGNING_KEY_B64: ${{ secrets.METACODE_MANIFEST_SIGNING_KEY_B64 }}
        run: |
          $version = node -p "require('./package.json').version"
          $artifactRoot = Join-Path $env:METACODE_PACKAGE_ROOT $version
          $artifactDirectory = Join-Path $artifactRoot 'artifacts'
          $installerName = "Meta-Code-Setup-$version-x64.exe"
          $installer = Join-Path $artifactDirectory $installerName
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME"
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/$installerName"
          if (-not $env:METACODE_MANIFEST_SIGNING_KEY_B64) { throw 'Missing METACODE_MANIFEST_SIGNING_KEY_B64 repository secret' }
          $signingKey = Join-Path $artifactRoot 'manifest-signing-key.pem'
          [IO.File]::WriteAllBytes($signingKey, [Convert]::FromBase64String($env:METACODE_MANIFEST_SIGNING_KEY_B64))
          try {
            npm run release:prepare -- --asset $installer --release-url $releaseUrl --asset-url $assetUrl --platform win32 --arch x64 --out $artifactRoot --build-id $env:GITHUB_SHA --signing-key $signingKey --signing-key-id meta-code-release-2026
          } finally {
            Remove-Item -LiteralPath $signingKey -Force -ErrorAction SilentlyContinue
          }
          $manifest = Join-Path $artifactRoot "meta-code-$version\stable\latest.json"
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $artifactDirectory 'latest.json')
          $checksumFile = Join-Path $artifactDirectory 'SHA256SUMS.txt'
          Get-ChildItem -LiteralPath $artifactDirectory -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object { "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $($_.Name)" } |
            Set-Content -LiteralPath $checksumFile -Encoding utf8NoBOM

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $artifactDirectory = Join-Path (Join-Path $env:METACODE_PACKAGE_ROOT $version) 'artifacts'
          $assets = @(
            (Join-Path $artifactDirectory "Meta-Code-Setup-$version-x64.exe"),
            (Join-Path $artifactDirectory "Meta-Code-Portable-$version-x64.exe"),
            (Join-Path $artifactDirectory "Meta-Code-Setup-$version-x64.exe.blockmap"),
            (Join-Path $artifactDirectory 'latest.json'),
            (Join-Path $artifactDirectory 'SHA256SUMS.txt')
          )
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
            gh release edit $env:GITHUB_REF_NAME --title "Meta Code $version"
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --title "Meta Code $version" --generate-notes --verify-tag
          }
