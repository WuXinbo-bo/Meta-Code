name: Feature request
description: Propose a focused product or integration improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the user-visible result, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Conversation, Delegation, Task orchestration, Provider or ACP, Skill or MCP, Files, Settings, Updates, Other]
    validations:
      required: true
